name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # ngsnap renders the Neuroglancer figures during quarto render (TASK-7).
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install build tooling (ngsnap from git)
        run: uv sync

      - name: Install the pinned Chrome for Testing browser
        run: uv run python -c "from ngsnap.render import install_browser; install_browser()"

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.3.450"

      # Renders once here (PR status check and the source for the deploy artifact).
      - uses: quarto-dev/quarto-actions/render@v2

      # Only main needs the artifact; PRs stop at the render above.
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Publishes the artifact built above; no re-render, no gh-pages branch.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
