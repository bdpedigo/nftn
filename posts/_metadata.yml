# Defaults for every post in posts/ (Quarto merges this into each post's
# front matter). It does not apply to root pages such as the home listing or
# the submission form, so giscus comments appear on posts only.

# giscus comments, backed by GitHub Discussions on the site repo.
#
# PLACEHOLDER: repo-id and category-id are blank until Ben, as repo admin:
#   1. Enables Discussions on github.com/bdpedigo/nftn.
#   2. Installs the giscus app (https://github.com/apps/giscus) on the repo.
#   3. Runs the configurator at https://giscus.app with repo bdpedigo/nftn and
#      the chosen category, then copies data-repo-id and data-category-id here.
# giscus does not load until both IDs are filled in.
comments:
  giscus:
    repo: bdpedigo/nftn
    repo-id: ""
    # Create a Discussions category (for example "Comments") for post threads.
    category: "Comments"
    category-id: ""
    # One discussion per post URL path.
    mapping: pathname
    reactions-enabled: true
    input-position: bottom
    theme: light
    language: en
    loading: lazy
